    <style>
      :root {
        color-scheme: light dark;
        --color-bg: #ffffff;
        --color-bg-alt: #f5f5f7;
        --color-text: #1d1d1f;
        --color-text-muted: #6e6e73;
        --color-border: rgb(0 0 0 / 0.1);
        --color-line: rgb(0 0 0 / 0.14);
        --glass-tint: rgb(255 255 255 / 0.5);
        --glass-edge: rgb(255 255 255 / 0.85);
        --glass-rim: rgb(0 0 0 / 0.08);
        --glass-shadow: 0 4px 20px rgb(0 0 0 / 0.035);
        --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --text-hero: clamp(3rem, 1.6rem + 6.4vw, 6.5rem);
        --text-lead: clamp(1.125rem, 1rem + 0.6vw, 1.625rem);
        --text-eyebrow: clamp(0.8125rem, 0.78rem + 0.2vw, 0.9375rem);
        --header-height: 56px;
        --gutter: clamp(16px, 5vw, 48px);
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #000000;
          --color-bg-alt: #111112;
          --color-text: #f5f5f7;
          --color-text-muted: #a1a1a6;
          --color-border: rgb(255 255 255 / 0.12);
          --color-line: rgb(255 255 255 / 0.18);
          --glass-tint: rgb(20 20 22 / 0.45);
          --glass-edge: rgb(255 255 255 / 0.22);
          --glass-rim: rgb(255 255 255 / 0.1);
          --glass-shadow: 0 8px 32px rgb(0 0 0 / 0.4);
        }
      }

      @media (max-width: 734px) {
        :root {
          --header-height: 48px;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      p {
        margin: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--color-text);
        outline-offset: 3px;
      }

      .header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--header-height);
        background: var(--glass-tint);
        backdrop-filter: blur(2px) saturate(180%);
        -webkit-backdrop-filter: blur(2px) saturate(180%);
        box-shadow:
          inset 0 -1px 0 var(--glass-edge),
          0 1px 0 var(--glass-rim),
          var(--glass-shadow);
      }


      .header__logo {
        display: block;
        height: 24px;
        width: auto;
        fill: var(--color-text);
      }

      main {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        min-height: 100svh;
        padding: calc(var(--header-height) + 64px) var(--gutter) 64px;
        overflow: hidden;
        text-align: center;
      }

      .curve {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        clip-path: inset(0 100% 0 0);
        animation: draw 3200ms var(--ease-out) 300ms forwards;
      }

      .curve path {
        fill: none;
        stroke: var(--color-line);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }

      .content {
        position: relative;
      }

      .eyebrow {
        font-size: var(--text-eyebrow);
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-text-muted);
      }

      .title {
        margin-top: 12px;
        font-size: var(--text-hero);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .lead {
        max-width: 38ch;
        margin: 24px auto 0;
        font-size: var(--text-lead);
        line-height: 1.4;
        color: var(--color-text-muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin-top: 40px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 24px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-size: 1.0625rem;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background-color 250ms,
          color 250ms,
          opacity 250ms,
          transform 300ms var(--ease-out);
      }

      .button:active {
        transform: scale(0.96);
      }

      .button--primary {
        background: var(--color-text);
        color: var(--color-bg);
      }

      .button--primary:hover {
        opacity: 0.82;
      }

      .button--secondary {
        border-color: var(--color-text);
        background: transparent;
        color: var(--color-text);
      }

      .button--secondary:hover {
        background: var(--color-text);
        color: var(--color-bg);
      }

      .reveal {
        opacity: 0;
        transform: translateY(36px);
        animation: reveal 1000ms var(--ease-out) var(--delay, 0ms) forwards;
      }

      .footer {
        border-top: 1px solid var(--color-border);
        background: var(--color-bg-alt);
        color: var(--color-text-muted);
        font-size: 0.75rem;
      }

      .footer p {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px var(--gutter);
      }

      @keyframes reveal {
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes draw {
        to {
          clip-path: inset(0 0 0 0);
        }
      }

      @media (max-width: 734px) {
        .header__logo {
          height: 20px;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
          max-width: 320px;
          margin-inline: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .reveal,
        .curve {
          animation: none;
          opacity: 1;
          transform: none;
          clip-path: none;
        }
      }
    </style>
